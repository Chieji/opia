[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opia"
version = "0.1.0"
description = "OpenCode-Compatible AI CLI Agent"
readme = "docs/README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Chieji", email = "1asimdoing@gmail.com" }
]
keywords = ["ai", "cli", "agent", "llm", "mcp", "openai", "anthropic", "groq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "keyring>=25.0.0",
    "cryptography>=42.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "aiofiles>=23.0.0",
    "anyio>=4.0.0",
    "GitPython>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
]

[project.scripts]
opia = "opia.cli.main:app"

[project.urls]
Homepage = "https://github.com/Chieji/opia"
Repository = "https://github.com/Chieji/opia"
Issues = "https://github.com/Chieji/opia/issues"

[tool.hatch.build.targets.wheel]
packages = ["opia"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=opia --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["opia"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]
